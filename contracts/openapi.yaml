openapi: 3.0.3
info:
  title: LeagueOfLegends API (gateway contract)
  version: 0.1.0
  description: >
    HTTP contracts exposed via Gateway / DevGateway for the leagueoflegends microservice.
servers:
  - url: http://localhost:8083
    description: Local DevGateway
  - url: http://localhost:5000
    description: Platform Gateway
paths:
  /api/leagueoflegends/Players/actions/Resolve:
    post:
      operationId: resolvePlayer
      summary: Resolve a LoL sheet from a Platform user public id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                platformUserPublicId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: '{ playerPublicId?, hasSheet }'
  /api/leagueoflegends/Players/actions/Options:
    post:
      operationId: playerOptions
      summary: Catalog for Riot ID, lanes, ranks and champions
      responses:
        '200':
          description: '{ lanes, regions, champions, championKinds, tiers, divisions }'
  /api/leagueoflegends/HomeFeed/actions/Get:
    post:
      operationId: getHomeFeed
      summary: Hub rails — latest LFG and player sheets
      responses:
        '200':
          description: '{ latestLfg, latestPlayers }'
  /api/leagueoflegends/LfgAds/actions/ListRecent:
    post:
      operationId: listRecentLfgAds
      summary: Latest active LFG messages for the global rail
      responses:
        '200':
          description: LfgAdSummary[]
  /api/leagueoflegends/LfgAds/actions/ListBefore:
    post:
      operationId: listBeforeLfgAds
      summary: Older LFG messages for the chronological rail
      responses:
        '200':
          description: LfgAdSummary[]
  /api/leagueoflegends/LfgAds/actions/Create:
    post:
      operationId: createLfgAd
      summary: Post a player LFG message (auth)
      responses:
        '200':
          description: LfgAdSummary
  /api/health:
    get:
      operationId: health
      summary: DevGateway health
      responses:
        '200':
          description: Healthy
