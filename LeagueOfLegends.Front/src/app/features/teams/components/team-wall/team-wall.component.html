<gc-entity-wall
    [posts]="store.posts()"
    [pending]="store.pending()"
    [canPublish]="canPublish()"
    [canModerate]="canModerate()"
    [playerPublicId]="playerPublicId()"
    [loading]="store.loading()"
    [loadingPending]="store.loadingPending()"
    [loadingMore]="store.loadingMore()"
    [hasMore]="store.hasMore()"
    [posting]="store.posting()"
    [queuedNotice]="queuedNotice()"
    [labels]="labels"
    (loadMoreClick)="store.loadMore()"
    (moderateClick)="moderate($event)"
    (removeClick)="remove($event)"
    (editStart)="onEditStart()"
>
    <lol-team-post-form
        gcEntityWallComposer
        #composer
        [saving]="store.posting()"
        [errorCode]="store.errorCode()"
        [moderated]="canModerate()"
        (save)="publish($event)"
    />

    <ng-template gcEntityWallEdit let-post>
        <lol-team-post-form
            [post]="$any(post)"
            [saving]="store.posting()"
            [errorCode]="store.errorCode()"
            [moderated]="canModerate()"
            (save)="saveEdit($any(post), $event)"
            (cancel)="cancelEdit()"
        />
    </ng-template>
</gc-entity-wall>
