<section class="media-manager">
    @if (store().loading()) {
        @if (kind() === "stream") {
            <div class="media-manager__streams media-manager__streams--skeleton" aria-busy="true">
                <gc-skeleton width="100%" height="12rem" radius="0.5rem" />
            </div>
        } @else {
            <div class="media-manager__gallery-skeleton" aria-busy="true">
                @for (placeholder of galleryPlaceholders; track placeholder) {
                    <gc-skeleton width="100%" height="100%" radius="0.5rem" />
                }
            </div>
        }
    } @else if (kind() === "stream") {
        @if (items().length === 0) {
            <p class="media-manager__empty" i18n="@@lol.media.emptyStream">No stream declared yet.</p>
        } @else {
            <div class="media-manager__streams">
                @for (item of items(); track item.publicId) {
                    <figure class="media-manager__stream">
                        <gc-twitch-embed [channel]="item.url" />
                        @if (item.caption) {
                            <figcaption>{{ item.caption }}</figcaption>
                        }
                    </figure>
                }
            </div>
        }
    } @else {
        <gc-media-gallery
            [items]="galleryItems()"
            [kind]="kind() === 'video' ? 'video' : 'photo'"
            [emptyLabel]="emptyLabel()"
        />
    }
</section>
